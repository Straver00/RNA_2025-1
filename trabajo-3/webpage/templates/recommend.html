{% extends 'base.html' %}
{% block content %}
  <section>
    <h2>Recomendación de Destinos de Viaje</h2>
    <form method="post">
      <label for="user_id">ID de Usuario:</label>
      <input type="number" id="user_id" name="user_id" required>
      <button type="submit">Obtener Recomendaciones</button>
    </form>
    {% if recommendations %}
      <ul>
        {% for dest in recommendations %}
          <li>{{ dest }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </section>
{% endblock %}
